# mdast-util-to-markdown is held at 2.1.2 because remark-mdc cannot stringify bold or
# italic text with anything newer (nuxt-content/remark-mdc#161).
#
# 2.1.3 rewrote the `strong` and `emphasis` handlers to hand the node back to
# `containerPhrasing`, which dispatches to whatever handler is registered and expects it
# to carry an `attention` property. remark-mdc 3.11.1 registers plain wrappers that call
# the default handler, so the two call each other until the stack overflows. On this site
# that is /llms-full.txt, which @nuxt/content stringifies through remark-mdc: it returns
# 500 and the build exits on the prerender error. The failure is loud, so a refresh that
# drops this hold cannot ship it unnoticed.
#
# renovate.json caps this package below 2.1.3 so the grouped update stops proposing it.
#
# Retires when remark-mdc releases a fix. Check with `npm view remark-mdc version` against
# that issue, then delete this entry and that rule, run `pnpm install`, and confirm `mise run build`
# prerenders /llms-full.txt.
#
# archiver's readdir-glob is raised to 4 because 3 depends on minimatch 10.2.6, whose glob
# pattern preprocessing can be driven into quadratic work (GHSA-g3hv-75wg-m249). readdir-glob
# 4.0.0's only change is that minimatch upgrade, to ^11.0.1, so its code is otherwise 3's.
# archiver 8.0.0, the latest, still asks for readdir-glob ^3, and comes from nitropack 2,
# which Nuxt 4 still installs although the server builds with Nitro v3 (ADR-013), and which
# uses archiver only in its Azure preset.
#
# Retires when archiver asks for readdir-glob ^4, or when nitropack leaves the dependency tree
# (Nuxt 5). Check with `pnpm view archiver dependencies.readdir-glob` and
# `pnpm why archiver`, then delete this entry and run `pnpm install`.
#
# zod 3.25.76 stays locked, with no override, although GHSA-mrhx-c7xc-m3w5 (memory exhaustion
# validating oversized constrained collections; Dependabot alert #46) is fixed only in zod
# 4.6.6. @nuxt/content 3.17.0, the latest, asks for zod ^3.25.76 (zod-to-json-schema and
# @modelcontextprotocol/sdk then resolve their zod peer to it too), no 3.x release carries the
# fix, and forcing zod 4 on Content would break its collection schemas. The exposure is
# small: zod 3 validates this repository's own content at build time, and production is a
# static site with no server to send it oversized input.
#
# Retires when @nuxt/content moves to zod 4. Check with
# `pnpm view @nuxt/content dependencies.zod`, then run `pnpm install`, confirm `pnpm why zod`
# lists no 3.x, and that Dependabot closes the alert.
overrides:
  mdast-util-to-markdown: 2.1.2
  archiver>readdir-glob: ^4.0.0

allowBuilds:
  "@parcel/watcher": false
  "@tailwindcss/oxide": false
  better-sqlite3: true
  esbuild: false
  sharp: true
  unrs-resolver: false
  vue-demi: false
