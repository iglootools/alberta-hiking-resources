name: preflight

on: push

concurrency:
  # On main the group carries the commit sha, so every push gets a group of its own and
  # nothing is cancelled; everywhere else the group is the ref, so a new push supersedes the
  # run still in flight. See guidelines/project-setup/workflows.md in iglootools/common for why
  # head_sha is tried before github.sha.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && format('main-{0}', github.event.workflow_run.head_sha || github.sha) || github.ref }}
  cancel-in-progress: true

env:
  # Fail on a stale uv.lock instead of silently re-resolving on the runner.
  UV_LOCKED: 1

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Read-only: the job runs install scripts, lints, tests and the build, all third-party
    # code, on every branch Renovate's included, so it must not hold a token that can push.
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.11.12

      - name: CI
        run: mise run ci-preflight
