name: renovate-mise-lock

on:
  push:
    branches:
      - "renovate/**"
  # Regenerate the lock on demand without a dummy push:
  # gh workflow run renovate-mise-lock.yml --ref renovate/<branch>
  # No repository_dispatch: it always runs on the default branch, which the job below skips.
  workflow_dispatch:

# Avoid overlapping runs racing to push to the same branch. Stays here rather than in the shared
# workflow because concurrency governs the run these triggers create.
concurrency:
  group: renovate-mise-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mise-lock:
    # A manual dispatch names its own ref: run only on a Renovate branch, never push a
    # regenerated lock to main or a contributor's branch.
    if: startsWith(github.ref, 'refs/heads/renovate/')
    permissions:
      # Must be granted here. `permissions` in the called workflow is a ceiling on what the
      # caller allowed, not a grant of its own, so without this the job regenerates mise.lock
      # and then cannot push it.
      contents: write
    uses: iglootools/common/.github/workflows/reusable-renovate-mise-lock.yml@e066ee8ebf5c067045afec10a1a3d1b1b13fa086 # v2.5.0
    # The iglootools GitHub App the lock is pushed as, so the preflight it triggers starts
    # without waiting for approval (guidelines/project-setup/shared-workflows.md in
    # iglootools/common). Named rather than `secrets: inherit`, which would hand the called
    # workflow every secret the repository can read.
    secrets:
      app-client-id: ${{ secrets.RENOVATE_LOCK_APP_CLIENT_ID }}
      app-private-key: ${{ secrets.RENOVATE_LOCK_APP_PRIVATE_KEY }}
    with:
      # Pinned here, not in the shared workflow: project-setup/workflows.md requires it to match the
      # version this project's mise.lock was generated with, and the custom manager below lives
      # in this repository's renovate.json. The input is named `version` because that is what
      # that manager matches — see the shared workflow's input description.
      # renovate: datasource=github-releases depName=jdx/mise
      version: 2026.11.12
