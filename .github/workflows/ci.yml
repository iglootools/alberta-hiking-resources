name: ci

on: push

concurrency:
  # On main the group carries the commit sha, so every push gets a group of its own and
  # nothing is cancelled; everywhere else the group is the ref, so a new push supersedes the
  # run still in flight. See project-setup.md in common-guidelines for why head_sha is tried
  # before github.sha.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && format('main-{0}', github.event.workflow_run.head_sha || github.sha) || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.8.10

      - name: CI
        run: mise run ci
