name: release

on:
  # Manually trigger the workflow using
  # gh workflow run release.yml # --ref <branch>
  # gh workflow run release.yml -f dry-run=true # preview the next version and notes
  # gh run list --workflow release.yml
  workflow_dispatch:
    inputs:
      dry-run:
        description: Print the next version and its release notes; tag and release nothing.
        type: boolean
        default: false
  repository_dispatch:

concurrency:
  # Deliberately unlike preflight.yml: this workflow mutates state outside the repository and is
  # neither idempotent nor reversible, so it must never be cancelled part-way through. A
  # second run queues behind the one in flight instead of killing it.
  #
  # The key is the workflow name alone, with no ref or sha, so that two runs can never
  # overlap even when they carry different refs — a manual `gh workflow run` and an automatic
  # trigger can both aim at the same version, and a half-finished or doubled release costs far
  # more than a short wait. GitHub keeps at most one run pending per group, so a third arrival
  # supersedes the *pending* run, never the running one.
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # semantic-release pushes the version tag and creates the GitHub release.
      contents: write
      # @semantic-release/github comments on the issues a release resolves, and opens an issue
      # when a release fails.
      issues: write
      # @semantic-release/github comments on the pull requests a release includes.
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.11.12

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Empty for repository_dispatch, which always releases.
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            mise run ci-release --dry-run
          else
            mise run ci-release
          fi
