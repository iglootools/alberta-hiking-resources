[tools]
dprint = "0.64.3"
jq = "1.8.2"
node = "26.13.0"
pnpm = "12.17.0"
rumdl = "0.3.4"
# Renovate, for lint-renovate and renovate-dry-run (guidelines/project-setup/dependency-automation.md
# in iglootools/common, which explains both options). trust_policy_excludes exempts one reviewed
# release, published by hand without provenance; allow_builds lets re2 build its native module,
# so the validator checks regexes with RE2, the engine Renovate runs.
# Drop the exclusion once Renovate no longer resolves to @yarnpkg/libzip@3.2.2; reviewed in
# iglootools/common's mise.toml.
"npm:renovate" = { version = "44.239.1", trust_policy_excludes = ["@yarnpkg/libzip@3.2.2"], allow_builds = ["re2"] }
shellcheck = "0.11.0"
# python and uv run the shared iglootools commands, a dev dependency in pyproject.toml
# (guidelines/project-setup/iglootools-cli.md in iglootools/common). This is not a Python
# project: nothing else here uses them.
python = "3.15.2"
uv = "0.13.7"

[env]
# uv builds .venv on the interpreter mise installed, never a system one of the same version
# (guidelines/project-setup/python-tooling.md in iglootools/common, "Mise and uv").
UV_PYTHON = { value = "{{ tools.python.path }}", tools = true }
UV_PYTHON_DOWNLOADS = "never"
UV_PYTHON_PREFERENCE = "only-system"

[settings]
# Record every tool in mise.lock (guidelines/project-setup/mise.md in iglootools/common,
# "Check `mise.lock` in a scratch copy").
lockfile = true
# [deps.uv] is experimental; set here so a fresh clone behaves as CI does.
experimental = true
# [deps.uv] creates .venv; mise only sources it.
python.uv_venv_auto = "source"

# Runs `uv sync` before `mise run` when uv.lock or pyproject.toml changed, or .venv is missing.
[deps.uv]
auto = true

[tasks.install]
description = "Install dependencies"
run = "pnpm install --frozen-lockfile"

[tasks.build]
description = "Build the Nuxt application"
run = "pnpm build"

[tasks.dev]
description = "Start Nuxt dev server"
run = "pnpm dev"

[tasks.preview]
description = "Preview the Nuxt production build"
run = "pnpm preview"

# Task families (guidelines/project-setup/mise.md in iglootools/common, "Name tasks by
# family"): a task that rewrites files is named for what it writes (fmt, build-trip-index),
# anything that fails without writing is a lint-*, and preflight runs every lint and test before
# a push.

# The site's build is itself a check: a broken page fails the prerender, so preflight builds
# (guidelines/project-setup/mise.md in iglootools/common, "Give each workflow job one `ci-*`
# task"). It runs after the lints, since `nuxt typecheck` and `nuxt build` both write .nuxt/.
[tasks.preflight]
description = "Run every lint and the tests in parallel, then build the site (what CI runs)"
run = [
  { tasks = ["lint", "test"] },
  { task = "build" },
]

# Every test here is fast, so preflight-quick leaves out only the build.
[tasks.preflight-quick]
description = "Run every lint and the tests in parallel (preflight without the build)"
run = [
  { tasks = ["lint", "test"] },
]

[tasks.ci-preflight]
description = "Install, then run preflight (what the preflight workflow runs)"
run = [
  { task = "install" },
  { task = "preflight" },
]

[tasks.test]
description = "Run the trip report index tests"
run = "pnpm test"

# Writers. dprint formats the JSON, TOML and YAML, rumdl the Markdown; ESLint's stylistic rules
# own the code. See guidelines/project-setup/formatting.md in iglootools/common.
[tasks.fmt]
description = "Format the JSON, TOML, YAML and Markdown with dprint and rumdl (rewrites files; lint-fmt verifies only)"
run = [
  { task = "fmt-dprint" },
  { task = "fmt-rumdl" },
]

[tasks.fmt-dprint]
description = "Format the JSON, TOML and YAML with dprint"
run = "dprint fmt"

[tasks.fmt-rumdl]
description = "Format the Markdown with rumdl"
run = "rumdl fmt ."

# Lints: each fails without writing anything.
[tasks.lint]
description = "Run every lint"
run = [
  { task = "lint-fmt" },
  { task = "lint-eslint" },
  { task = "lint-shell" },
  { task = "lint-markdown" },
  { task = "lint-types" },
  { task = "lint-renovate" },
  { task = "lint-common-pins" },
  { task = "lint-toc" },
  { task = "lint-lock-mise" },
  { task = "lint-lock-uv" },
]

# The formatters exit 0 whether or not they changed anything, so they cannot be the gate. rumdl
# has no lint-fmt-* of its own: lint-markdown reports what `rumdl fmt` would change along with
# what it cannot fix.
[tasks.lint-fmt]
description = "Check that the JSON, TOML and YAML are formatted (fix with `mise run fmt`)"
run = [
  { task = "lint-fmt-dprint" },
]

[tasks.lint-fmt-dprint]
description = "Check that the JSON, TOML and YAML are formatted with dprint (fix with `mise run fmt-dprint`)"
run = "dprint check"

[tasks.lint-eslint]
description = "Lint the code with ESLint, its stylistic rules included"
run = "pnpm lint"

[tasks.lint-markdown]
description = "Lint the Markdown with rumdl (configured in .rumdl.toml; fix what it can with `mise run fmt-rumdl`)"
run = "rumdl check ."

[tasks.lint-types]
description = "Type-check with the Nuxt typecheck"
run = "pnpm typecheck"

[tasks.lint-shell]
description = "Lint the tracked shell scripts with shellcheck"
run = "uv run --no-sync iglootools shell lint"

# Every Markdown document longer than two screens carries a generated table of contents
# (guidelines/documentation/layout.md in iglootools/common). The site's pages under content/
# go without one: app/pages/[...slug].vue renders its own.
[tasks.toc]
description = "Add and regenerate the tables of contents in the Markdown docs"
run = "uv run --no-sync iglootools docs toc --exclude 'content/**'"

[tasks.lint-toc]
description = "Check that every Markdown document has an up-to-date table of contents (fix with `mise run toc`)"
run = "uv run --no-sync iglootools docs toc --check --exclude 'content/**'"

# Every pin on iglootools/common names the same release, and `iglootools common adopt` would
# move each one (guidelines/project-setup/iglootools-cli.md in iglootools/common).
[tasks.lint-common-pins]
description = "Check that every pin on iglootools/common agrees (fix with `iglootools common adopt`)"
run = "uv run --no-sync iglootools common check-pins"

[tasks.build-pages]
description = "Build the Nuxt application for GitHub Pages deployment"
depends = ["install"]
run = "pnpm build:pages"

[tasks.build-trip-index]
description = "Rebuild the by-objective trip report index from the source blogs"
run = "pnpm build:trip-index"

# --strict fails on a config Renovate would migrate, which a plain run reports only as a
# warning. With no argument it validates renovate.json as repository config.
[tasks.lint-renovate]
description = "Validate the Renovate config with Renovate's validator, strictly"
run = "renovate-config-validator --strict"

[tasks.lint-lock-mise]
description = "Check that mise.lock is up to date with mise.toml"
run = "uv run --no-sync iglootools mise lock-check"

[tasks.lint-lock-uv]
description = "Check that uv.lock is up to date with pyproject.toml"
run = "uv lock --check"
