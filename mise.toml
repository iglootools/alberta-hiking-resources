[tools]
dprint = "0.64.3"
jq = "1.8.2"
node = "26.13.0"
pnpm = "12.17.0"
rumdl = "0.3.4"
# Renovate, for lint-renovate and renovate-dry-run (guidelines/project-setup/dependency-automation.md
# in iglootools/common, which explains both options). trust_policy_excludes exempts one reviewed
# release, published by hand without provenance; allow_builds lets re2 build its native module,
# so the validator checks regexes with RE2, the engine Renovate runs.
"npm:renovate" = { version = "44.239.1", trust_policy_excludes = ["@yarnpkg/libzip@3.2.2"], allow_builds = ["re2"] }
shellcheck = "0.11.0"
# Runs the shared iglootools commands through uvx (below).
uv = "0.13.7"

[env]
# The shared iglootools commands (guidelines/project-setup/iglootools-cli.md in
# iglootools/common), run through uvx since this project has no Python environment. The
# comment is what lets Renovate keep the release current, through the shared base preset.
# renovate: datasource=github-tags depName=iglootools/common
IGLOOTOOLS_VERSION = "v1.32.0"
IGLOOTOOLS = "uvx --from git+https://github.com/iglootools/common@{{ env.IGLOOTOOLS_VERSION }} iglootools"

[tasks.install]
description = "Install dependencies"
run = "pnpm install --frozen-lockfile"

[tasks.build]
description = "Build the Nuxt application"
run = "pnpm build"

[tasks.dev]
description = "Start Nuxt dev server"
run = "pnpm dev"

[tasks.preview]
description = "Preview the Nuxt production build"
run = "pnpm preview"

[tasks.postinstall]
description = "Run nuxt prepare after install"
run = "pnpm postinstall"

# Task families (guidelines/project-setup/mise.md in iglootools/common, "Name tasks by
# family"): a task that rewrites files is named for what it writes (fmt, build-trip-index),
# anything that fails without writing is a lint-*, and preflight runs every lint and test before
# a push.

[tasks.preflight]
description = "Run every lint and the tests (what CI runs, before it builds)"
run = [
  { task = "lint" },
  { task = "test" },
]

# Every test here is fast, so it differs from preflight in name only; it exists so that
# `mise run preflight-quick` works the same in every project.
[tasks.preflight-quick]
description = "Run every lint and the tests (the same as preflight: every test here is fast)"
run = [
  { task = "lint" },
  { task = "test" },
]

[tasks.ci-preflight]
description = "Install, run every lint and test, then build (what the preflight workflow runs)"
run = [
  { task = "install" },
  { task = "preflight" },
  { task = "build" },
]

[tasks.test]
description = "Run the trip report index tests"
run = "pnpm test"

# Writers. dprint formats the JSON, TOML and YAML, rumdl the Markdown; ESLint's stylistic rules
# own the code. See guidelines/project-setup/formatting.md in iglootools/common.
[tasks.fmt]
description = "Format the JSON, TOML, YAML and Markdown with dprint and rumdl (rewrites files; lint-fmt verifies only)"
run = [
  { task = "fmt-dprint" },
  { task = "fmt-rumdl" },
]

[tasks.fmt-dprint]
description = "Format the JSON, TOML and YAML with dprint"
run = "dprint fmt"

[tasks.fmt-rumdl]
description = "Format the Markdown with rumdl"
run = "rumdl fmt ."

# Lints: each fails without writing anything.
[tasks.lint]
description = "Run every lint"
run = [
  { task = "lint-fmt" },
  { task = "lint-eslint" },
  { task = "lint-shell" },
  { task = "lint-markdown" },
  { task = "lint-types" },
  { task = "lint-renovate" },
]

# The formatters exit 0 whether or not they changed anything, so they cannot be the gate. rumdl
# has no lint-fmt-* of its own: lint-markdown reports what `rumdl fmt` would change along with
# what it cannot fix.
[tasks.lint-fmt]
description = "Check that the JSON, TOML and YAML are formatted (fix with `mise run fmt-dprint`)"
run = "dprint check"

[tasks.lint-eslint]
description = "Lint the code with ESLint, its stylistic rules included"
run = "pnpm lint"

[tasks.lint-markdown]
description = "Lint the Markdown with rumdl (configured in .rumdl.toml; fix what it can with `mise run fmt-rumdl`)"
run = "rumdl check ."

[tasks.lint-types]
description = "Type-check with the Nuxt typecheck"
run = "pnpm typecheck"

[tasks.lint-shell]
description = "Lint the tracked shell scripts with shellcheck"
run = "$IGLOOTOOLS shell lint"

[tasks.update]
description = "Update all dependencies to latest versions"
run = "pnpm update --latest"

[tasks.build-pages]
description = "Build the Nuxt application for GitHub Pages deployment"
depends = ["install"]
run = "pnpm build:pages"

[tasks.build-trip-index]
description = "Rebuild the by-objective trip report index from the source blogs"
run = "pnpm build:trip-index"

# --strict fails on a config Renovate would migrate, which a plain run reports only as a
# warning. With no argument it validates renovate.json as repository config.
[tasks.lint-renovate]
description = "Validate the Renovate config with Renovate's validator, strictly"
run = "renovate-config-validator --strict"
