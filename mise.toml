[tools]
dprint = "0.64.3"
node = "26.13.0"
pnpm = "12.17.0"
rumdl = "0.3.4"
shellcheck = "0.11.0"
# Runs the shared iglootools commands through uvx (below).
uv = "0.13.7"

[env]
# The shared iglootools commands (guidelines/project-setup/iglootools-cli.md in
# iglootools/common), run through uvx since this project has no Python environment. The
# comment is what lets Renovate keep the release current, through the shared base preset.
# renovate: datasource=github-tags depName=iglootools/common
IGLOOTOOLS_VERSION = "v1.29.1"
IGLOOTOOLS = "uvx --from git+https://github.com/iglootools/common@{{ env.IGLOOTOOLS_VERSION }} iglootools"

[tasks.install]
description = "Install dependencies"
run = "pnpm install --frozen-lockfile"

[tasks.build]
description = "Build the Nuxt application"
run = "pnpm build"

[tasks.dev]
description = "Start Nuxt dev server"
run = "pnpm dev"

[tasks.preview]
description = "Preview the Nuxt production build"
run = "pnpm preview"

[tasks.postinstall]
description = "Run nuxt prepare after install"
run = "pnpm postinstall"

[tasks.lint]
description = "Lint with ESLint"
run = "pnpm lint"

[tasks.typecheck]
description = "Run Nuxt typecheck"
run = "pnpm typecheck"

[tasks.test]
description = "Run the trip report index tests"
run = "pnpm test"

[tasks.ci]
description = "Run CI pipeline"
run = [
  { task = "install" },
  { task = "format-check" },
  { task = "lint" },
  { task = "lint-shell" },
  { task = "lint-markdown" },
  { task = "typecheck" },
  { task = "test" },
  { task = "build" },
]

# dprint formats the JSON, TOML and YAML, rumdl the Markdown; ESLint formats the code as part of
# `lint`. See guidelines/project-setup/formatting.md in iglootools/common.
[tasks.format]
description = "Format the JSON, TOML, YAML and Markdown with dprint and rumdl (rewrites files; see format-check to verify only)"
run = [
  "dprint fmt",
  "rumdl fmt .",
]

# The formatters exit 0 whether or not they changed anything, so they cannot be the gate. rumdl's
# check is lint-markdown, which reports what `rumdl fmt` would change along with what it cannot.
[tasks.format-check]
description = "Check that the JSON, TOML and YAML are formatted (fails instead of reformatting; fix with `mise run format`)"
run = "dprint check"

[tasks.lint-markdown]
description = "Lint the Markdown with rumdl (configured in .rumdl.toml; fix what it can with `mise run format`)"
run = "rumdl check ."

[tasks.lint-shell]
description = "Lint the tracked shell scripts with shellcheck"
run = "$IGLOOTOOLS shell lint"

[tasks.update]
description = "Update all dependencies to latest versions"
run = "pnpm update --latest"

[tasks.build-pages]
description = "Build the Nuxt application for GitHub Pages deployment"
depends = ["install"]
run = "pnpm build:pages"

[tasks.build-trip-index]
description = "Rebuild the by-objective trip report index from the source blogs"
run = "pnpm build:trip-index"
